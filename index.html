<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karma Balance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            overflow-x: hidden;
        }
        .font-cinzel { font-family: 'Cinzel', serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        .glass {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        /* Realistic Wax Seal */
        .wax-seal-btn {
            background: radial-gradient(circle at 30% 30%, #d32f2f, #8b0000);
            border: 3px solid #5a0000;
            box-shadow: 
                inset 2px 2px 4px rgba(255,255,255,0.3),
                inset -3px -3px 6px rgba(0,0,0,0.6),
                0 6px 15px rgba(0,0,0,0.5);
            border-radius: 48% 52% 45% 55% / 53% 47% 53% 47%; /* Organic irregular shape */
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            cursor: pointer;
        }
        .wax-seal-btn:hover {
            transform: scale(1.05) rotate(2deg);
            filter: brightness(1.1);
        }
        .wax-seal-btn:active {
            transform: scale(0.95);
        }
        .wax-seal-inner {
            border: 1px dashed rgba(255,255,255,0.2);
            border-radius: inherit;
            width: 80%;
            height: 80%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Navigation Selection Aura */
        .nav-aura {
            position: absolute;
            height: 40px;
            width: 40px;
            border-radius: 12px;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 0;
            filter: blur(15px);
            opacity: 0.5;
        }

        /* Tech Terminal Styling */
        .tech-terminal {
            background: #0a0a0c;
            border: 1px solid rgba(244, 63, 94, 0.3);
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.1), inset 0 0 40px rgba(0,0,0,1);
            position: relative;
            overflow: hidden;
        }
        .tech-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(244, 63, 94, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(244, 63, 94, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
        }
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(244, 63, 94, 0.1);
            opacity: 0.5;
            box-shadow: 0 0 10px rgba(244, 63, 94, 0.2);
            animation: scanline 4s linear infinite;
            pointer-events: none;
        }

        @keyframes scanline {
            0% { top: -5%; }
            100% { top: 105%; }
        }

        @keyframes rotate-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes nav-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .animate-nav-pop { animation: nav-pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        @keyframes entryIn {
            0% { opacity: 0; transform: translateY(20px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-entry { animation: entryIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .animate-rotate-slow { animation: rotate-slow 20s linear infinite; }
        .animate-spin-slow { animation: spin-slow 8s linear infinite; }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        .parchment {
            background: #fcf5e5;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            color: #3e2723;
        }
        
        @keyframes scrollOpen {
            0% { max-height: 0; opacity: 0; transform: scaleY(0); }
            100% { max-height: 600px; opacity: 1; transform: scaleY(1); }
        }
        .animate-scroll-open { animation: scrollOpen 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    </style>
